name: Release JAR

on:
  push:
    tags: ["v*"]          # triggers on git tag like v1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build fat JAR
        run: ./gradlew desktop:jar
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build/libs/DodgeGame-desktop-1.0.jar
